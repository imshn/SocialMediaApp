<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}SocialMediaApp{% endblock title %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
          crossorigin="anonymous"
  >
  <style>
    .create-post-wrapper {
      max-width: 600px;
      margin: auto;
      background: #fff;
    }

    .image-upload-area {
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-label {
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .form-control {
      border: none;
      resize: none;
      box-shadow: none !important;
      font-size: 15px;
    }

    .form-control:focus {
      box-shadow: none !important;
    }

    #id_image {
      display: none;
    }


    /* Hide scrollbar (clean look) */
    .overflow-auto::-webkit-scrollbar {
      display: none;
    }
    .overflow-auto {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Story gradient ring */
    .story-ring {
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(45deg, #feda75, #d62976, #962fbf);
      display: inline-block;
    }

    /* Story avatar */
    .story-avatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #dee2e6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    /* Hover effect */
    .story-item:hover .story-avatar {
      transform: scale(1.05);
      transition: 0.2s ease;
    }
    .post-action {
      cursor: pointer;
      transition: 0.2s ease;
    }

    .post-action:hover {
      transform: scale(1.1);
    }

    .card {
      border-radius: 12px;
    }

  </style>

</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top py-2">
  <div class="container">

    <!-- BRAND -->
    <a class="navbar-brand fw-bold fs-5 text-white" href="{% url 'home' %}">
      SocialMediaApp
    </a>

    <!-- TOGGLER -->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">

      {% if user.is_authenticated %}

      <!-- CENTER ICON NAV -->
      <div class="mx-auto d-flex align-items-center gap-4 fs-5">

        <a href="{% url 'home' %}" class="nav-icon active-icon">
          <i class="bi bi-house-door text-white"></i>
        </a>

        <a href="#" class="nav-icon position-relative">
          <i class="bi bi-chat-dots text-white"></i>
          <span class="notif-dot"></span>
        </a>

        <a href="{% url 'create_post' %}" class="nav-icon">
          <i class="bi bi-plus-square text-white"></i>
        </a>

        <a href="#" class="nav-icon">
          <i class="bi bi-bell text-white"></i>
        </a>

      </div>

      <!-- RIGHT SIDE -->
      <div class="d-flex align-items-center gap-3">

        <!-- Profile Avatar -->
        <a href="{% url 'profile' %}" class="profile-avatar">
          {% if user.profile_pic %}
          <img src="{{ user.profile_pic.url }}"
               class="rounded-circle"
               style="width:34px;height:34px;object-fit:cover;">
          {% else %}
          <div class="avatar-fallback">
            {{ user.username|first|upper }}
          </div>
          {% endif %}
        </a>

        <!-- Logout -->
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-outline-light px-3">
            Logout
          </button>
        </form>

      </div>

      {% else %}

      <div class="ms-auto d-flex gap-2">
        <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm px-3">
          Login
        </a>
        <a href="{% url 'register' %}" class="btn btn-light btn-sm px-3">
          Register
        </a>
      </div>

      {% endif %}

    </div>
  </div>
</nav>
